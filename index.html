<!doctype html><html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes"><title>汇率</title>
<style>
body{font-family:-apple-system,sans-serif;background:#111;color:#eee;margin:0;padding:20px;max-width:420px}
h1{font-size:20px}.row{display:flex;align-items:center;margin:12px 0;background:#1d1d1f;border-radius:12px;padding:10px 14px}
.row b{width:60px;font-size:18px}input{flex:1;font-size:22px;background:none;border:0;color:#fff;text-align:right;outline:none}
#s{font-size:12px;color:#888}
</style></head><body>
<h1>实时汇率</h1>
<div id="list"></div><div id="s">加载中…</div>
<script>
const C=[["CNY","人民币"],["HKD","港币"],["USD","美金"],["SGD","新币"]];let r=null;
const L=document.getElementById("list");
C.forEach(([c,n])=>{L.insertAdjacentHTML("beforeend",`<div class="row"><b title="${n}">${c}</b><input id="${c}" inputmode="decimal" placeholder="${n}"></div>`)});
function upd(src){const v=parseFloat(document.getElementById(src).value);C.forEach(([c])=>{if(c!==src)document.getElementById(c).value=isNaN(v)?"":(v/r[src]*r[c]).toFixed(2)})}
C.forEach(([c])=>document.getElementById(c).addEventListener("input",()=>r&&upd(c)));
fetch("https://open.er-api.com/v6/latest/USD").then(x=>x.json()).then(d=>{r=d.rates;
document.getElementById("s").textContent="汇率更新于 "+new Date(d.time_last_update_unix*1000).toLocaleString();
document.getElementById("CNY").value=100;upd("CNY")}).catch(()=>document.getElementById("s").textContent="获取汇率失败，请检查网络");
</script></body></html>
